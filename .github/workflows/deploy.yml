# ===========================================================================
# BrandX - CI/CD pipeline.
#
#   test   -> runs the Dockerized Django test suite on every push/PR
#   deploy -> after a green test on `main`, deploys over SSH
#
# Required repository secrets:
#   SSH_HOST       server hostname or IP
#   SSH_USER       deploy user (must be in the `docker` group)
#   SSH_KEY        private SSH key (OpenSSH format) for that user
#   SSH_PORT       SSH port (optional; defaults to 22)
#   DEPLOY_PATH    absolute path to the checkout on the server
#                  e.g. /home/deploy/brandx  (contains deploy/docker-compose.prod.yml)
# ===========================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: brandx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make deploy scripts executable
        run: chmod +x deploy/scripts/*.sh

      - name: Run the Dockerized test suite
        run: ./deploy/scripts/test.sh

  deploy:
    name: Deploy (SSH)
    needs: test
    runs-on: ubuntu-latest
    # Deploy only from the main branch, never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x deploy/scripts/*.sh
            ./deploy/scripts/deploy.sh --pull

      # ---------------------------------------------------------------------
      # Alternative without third-party actions (uses the OpenSSH client):
