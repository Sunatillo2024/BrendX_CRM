# ===========================================================================
# BrandX - host Nginx reverse proxy (use when the server already runs Nginx,
# e.g. for a Telegram bot webhook or for TLS termination).
#
#   1. Replace pos.example.com with your real domain (twice below).
#   2. sudo cp deploy/proxy/brandx.conf /etc/nginx/sites-available/brandx.conf
#   3. sudo ln -s /etc/nginx/sites-available/brandx.conf \
#                /etc/nginx/sites-enabled/brandx.conf
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Optional TLS:  sudo certbot --nginx -d pos.example.com
#
# This block is completely independent from any Telegram bot server block:
# it only points at the BrandX web container bound on loopback.
# ===========================================================================

server {
    listen 80;
    server_name pos.example.com;

    # Allow product photos / imports.
    client_max_body_size 25M;

    # Do not advertise the proxy.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;   # BRANDX_HTTP_BIND:BRANDX_HTTP_PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is "https" for the 443 block Certbot creates, which makes
        # request.is_secure() correct inside Django.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
