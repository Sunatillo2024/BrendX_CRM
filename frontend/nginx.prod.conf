# BrandX frontend - production Nginx configuration.
# Serves the built Angular SPA, proxies the Django API/admin and serves uploaded
# media from a shared read-only volume.
#
# NOTE: files in /etc/nginx/conf.d/ are included inside the http{} block, which
# is why the `map` directive below is allowed here.

# Report the scheme of the upstream (edge) proxy when one is present; otherwise
# fall back to the scheme of the connection to this container.
map $http_x_forwarded_proto $brandx_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream brandx_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;
    server_tokens off;

    # Security headers (X-Frame-Options matches Django's default DENY).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/woff font/woff2;

    # ---- Container health probe (served by Nginx, never reaches Django) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Django REST API, admin and i18n ----
    # Must be declared BEFORE the asset-cache rule so /api/... paths are proxied.
    location ~ ^/(api|admin|i18n)/ {
        proxy_pass http://brandx_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $brandx_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Django static files (served by WhiteNoise inside the backend) ----
    location ^~ /static/ {
        proxy_pass http://brandx_backend;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Uploaded media (shared read-only volume mounted at /var/www/media) ----
    location ^~ /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Hashed Angular build assets: safe to cache aggressively ----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Angular client-side routing ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
